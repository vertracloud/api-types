name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # Trusted publishing (OIDC) exige npm >= 11.5.1; o Node 24 já vem com npm 11.
          node-version: 24

      # pnpm-lock.yaml fica fora do git (.gitignore), então é install sem --frozen-lockfile.
      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish to npm
        # v1 de propósito: a v2 exige a CLI 3 do Changesets, e o repo usa a 2.
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # trusted publishing no npm, sem NPM_TOKEN
